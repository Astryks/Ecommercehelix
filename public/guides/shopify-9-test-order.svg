<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Place a test order" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Place a test order</title>
<rect width="1200" height="700" rx="18" fill="#f8fafc"/>
<rect x="20" y="20" width="820" height="620" rx="14" fill="#fff" stroke="#cbd5e1"/>
<rect x="20" y="20" width="820" height="40" rx="14" fill="#f1f5f9"/><rect x="20" y="46" width="820" height="14" fill="#f1f5f9"/>
<circle cx="44" cy="40" r="6" fill="#fca5a5"/><circle cx="64" cy="40" r="6" fill="#fcd34d"/><circle cx="84" cy="40" r="6" fill="#86efac"/>
<text x="430" y="45" font-size="13" fill="#64748b" text-anchor="middle">Shopify admin (simplified drawing)</text>
<rect x="20" y="60" width="180" height="580" rx="0" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="100" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Settings</text>
<text x="40" y="140" font-size="14" font-weight="700" fill="#008060" text-anchor="start">  Payments</text>
<text x="40" y="180" font-size="14" font-weight="400" fill="#334155" text-anchor="start">  Checkout</text>
<text x="40" y="220" font-size="14" font-weight="400" fill="#334155" text-anchor="start">  Notifications</text>
<text x="230" y="100" font-size="18" font-weight="800" fill="#0f172a" text-anchor="start">Shopify Payments &gt; Manage</text>
<rect x="230" y="120" width="580" height="80" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
<text x="250" y="152" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Test mode</text>
<text x="250" y="176" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Use test card numbers. No real money moves.</text>
<rect x="750" y="150" width="36" height="20" rx="10" fill="#008060" stroke="none" stroke-width="1"/>
<circle cx="776" cy="160" r="7" fill="#fff"/>
<rect x="230" y="220" width="580" height="250" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
<text x="250" y="250" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">After the test order, check:</text>
<rect x="250" y="266" width="18" height="18" rx="4" fill="#008060" stroke="#008060" stroke-width="1"/>
<text x="278" y="280" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">Order confirmation email arrived</text>
<rect x="250" y="304" width="18" height="18" rx="4" fill="#008060" stroke="#008060" stroke-width="1"/>
<text x="278" y="318" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">Stock went down by 1</text>
<rect x="250" y="342" width="18" height="18" rx="4" fill="#008060" stroke="#008060" stroke-width="1"/>
<text x="278" y="356" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">Shipping and tax look right</text>
<rect x="250" y="380" width="18" height="18" rx="4" fill="#008060" stroke="#008060" stroke-width="1"/>
<text x="278" y="394" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">Purchase seen in Meta and Google</text>
<rect x="250" y="418" width="18" height="18" rx="4" fill="#008060" stroke="#008060" stroke-width="1"/>
<text x="278" y="432" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">Order shows in Orders</text>
<rect x="230" y="490" width="580" height="120" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
<text x="250" y="520" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Then:</text>
<text x="250" y="546" font-size="13" font-weight="400" fill="#9a3412" text-anchor="start">Cancel the test order and turn test mode OFF.</text>
<text x="250" y="570" font-size="13" font-weight="400" fill="#9a3412" text-anchor="start">Place one small real order with your own card and refund it.</text>
<line x1="210" y1="140" x2="196" y2="140" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="196" cy="140" r="5" fill="#e11d48"/>
<circle cx="210" cy="140" r="17" fill="#e11d48" stroke="#fff" stroke-width="3"/>
<text x="210" y="146" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<line x1="830" y1="160" x2="786" y2="160" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="786" cy="160" r="5" fill="#e11d48"/>
<circle cx="830" cy="160" r="17" fill="#e11d48" stroke="#fff" stroke-width="3"/>
<text x="830" y="166" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<line x1="830" y1="340" x2="810" y2="340" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="810" cy="340" r="5" fill="#e11d48"/>
<circle cx="830" cy="340" r="17" fill="#e11d48" stroke="#fff" stroke-width="3"/>
<text x="830" y="346" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<line x1="830" y1="550" x2="810" y2="550" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="810" cy="550" r="5" fill="#e11d48"/>
<circle cx="830" cy="550" r="17" fill="#e11d48" stroke="#fff" stroke-width="3"/>
<text x="830" y="556" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<rect x="860" y="20" width="320" height="620" rx="14" fill="#0f172a"/>
<text x="884" y="56" font-size="18" font-weight="800" fill="#fff">Place a test order</text>
<circle cx="896" cy="87" r="13" fill="#e11d48"/><text x="896" y="92" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="920" y="92" font-size="14" fill="#e2e8f0">Open Settings, then Payments, then</text>
<text x="920" y="111" font-size="14" fill="#e2e8f0">Manage Shopify Payments.</text>
<circle cx="896" cy="143" r="13" fill="#e11d48"/><text x="896" y="148" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="920" y="148" font-size="14" fill="#e2e8f0">Turn on Test mode and buy</text>
<text x="920" y="167" font-size="14" fill="#e2e8f0">something on your phone with a</text>
<text x="920" y="186" font-size="14" fill="#e2e8f0">test card.</text>
<circle cx="896" cy="218" r="13" fill="#e11d48"/><text x="896" y="223" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="920" y="223" font-size="14" fill="#e2e8f0">Tick each check: email, stock,</text>
<text x="920" y="242" font-size="14" fill="#e2e8f0">shipping, tax, tracking.</text>
<circle cx="896" cy="274" r="13" fill="#e11d48"/><text x="896" y="279" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="920" y="279" font-size="14" fill="#e2e8f0">Cancel it, turn test mode off,</text>
<text x="920" y="298" font-size="14" fill="#e2e8f0">then do one small real order and</text>
<text x="920" y="317" font-size="14" fill="#e2e8f0">refund it.</text>
<text x="24" y="668" font-size="12" fill="#64748b">Screens change often. Labels on your screen may look a little different.</text>
<text x="1176" y="668" font-size="12" fill="#64748b" text-anchor="end">Ecommerce Helix guide · not a real screenshot</text></svg>