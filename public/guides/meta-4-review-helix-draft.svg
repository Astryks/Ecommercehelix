<text x="884" y="56" font-size="18" font-weight="800" fill="#fff">Review a Helix draft and</text>
<text x="884" y="80" font-size="18" font-weight="800" fill="#fff">launch it</text>
<circle cx="896" cy="111" r="13" fill="#b8601d"/><text x="896" y="116" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="920" y="116" font-size="14" fill="#e2e8f0">Find the campaign Helix made. It</text>
<text x="920" y="135" font-size="14" fill="#e2e8f0">starts with &#x27;Helix&#x27; and is</text>
<text x="920" y="154" font-size="14" fill="#e2e8f0">switched off.</text>
<circle cx="896" cy="186" r="13" fill="#b8601d"/><text x="896" y="191" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="920" y="191" font-size="14" fill="#e2e8f0">Press Edit. Change the words, add</text>
<text x="920" y="210" font-size="14" fill="#e2e8f0">your own photos or videos, and</text>
<text x="920" y="229" font-size="14" fill="#e2e8f0">check the budget.</text>
<circle cx="896" cy="261" r="13" fill="#b8601d"/><text x="896" y="266" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="920" y="266" font-size="14" fill="#e2e8f0">When you are happy, flip the</text>
<text x="920" y="285" font-size="14" fill="#e2e8f0">switch to On. That is you</text>
<text x="920" y="304" font-size="14" fill="#e2e8f0">launching it. Helix never does</text>
<text x="920" y="323" font-size="14" fill="#e2e8f0">this step.</text>
<text x="24" y="668" font-size="12" fill="#64748b">Helix only creates paused drafts. Nothing spends money until you switch it on.</text>
<text x="1176" y="668" font-size="12" fill="#64748b" text-anchor="end">Ecommerce Helix guide · not a real screenshot</text></svg>