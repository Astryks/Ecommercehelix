<rect x="860" y="20" width="320" height="620" rx="14" fill="#0f172a"/>
<text x="884" y="56" font-size="18" font-weight="800" fill="#fff">Add a product the right way</text>
<circle cx="896" cy="87" r="13" fill="#e11d48"/><text x="896" y="92" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="920" y="92" font-size="14" fill="#e2e8f0">Write a short title: product name</text>
<text x="920" y="111" font-size="14" fill="#e2e8f0">plus what it is or does.</text>
<circle cx="896" cy="143" r="13" fill="#e11d48"/><text x="896" y="148" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="920" y="148" font-size="14" fill="#e2e8f0">Add at least 4 photos: plain</text>
<text x="920" y="167" font-size="14" fill="#e2e8f0">background, in use, size,</text>
<text x="920" y="186" font-size="14" fill="#e2e8f0">close-up.</text>
<circle cx="896" cy="218" r="13" fill="#e11d48"/><text x="896" y="223" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="920" y="223" font-size="14" fill="#e2e8f0">Type the price and cost per item.</text>
<text x="920" y="242" font-size="14" fill="#e2e8f0">Helix uses cost for profit.</text>
<circle cx="896" cy="274" r="13" fill="#e11d48"/><text x="896" y="279" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="920" y="279" font-size="14" fill="#e2e8f0">Turn on Track quantity and add the</text>
<text x="920" y="298" font-size="14" fill="#e2e8f0">weight.</text>
<circle cx="896" cy="330" r="13" fill="#e11d48"/><text x="896" y="335" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="920" y="335" font-size="14" fill="#e2e8f0">Fill in the search listing in</text>
<text x="920" y="354" font-size="14" fill="#e2e8f0">plain words.</text>
<circle cx="896" cy="386" r="13" fill="#e11d48"/><text x="896" y="391" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="920" y="391" font-size="14" fill="#e2e8f0">Save as Draft, check it, then set</text>
<text x="920" y="410" font-size="14" fill="#e2e8f0">it to Active.</text>
<text x="24" y="668" font-size="12" fill="#64748b">Screens change often. Labels on your screen may look a little different.</text>
<text x="1176" y="668" font-size="12" fill="#64748b" text-anchor="end">Ecommerce Helix guide · not a real screenshot</text></svg>