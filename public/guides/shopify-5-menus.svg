<text x="44" y="142" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Orders</text>
<text x="44" y="182" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Products</text>
<text x="44" y="222" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Customers</text>
<text x="44" y="262" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Analytics</text>
<rect x="30" y="282" width="160" height="30" rx="6" fill="#e3f1ec" stroke="none" stroke-width="1"/>
<text x="44" y="302" font-size="14" font-weight="700" fill="#008060" text-anchor="start">Online Store</text>
<text x="44" y="342" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Settings</text>
<text x="230" y="100" font-size="18" font-weight="800" fill="#0f172a" text-anchor="start">Menus &gt; Main menu</text>
<rect x="230" y="120" width="580" height="330" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="250" y="140" width="380" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
