<circle cx="660" cy="154" r="17" fill="#b8601d" stroke="#fff" stroke-width="3"/>
<text x="660" y="160" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<line x1="660" y1="226" x2="630" y2="226" stroke="#b8601d" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="630" cy="226" r="5" fill="#b8601d"/>
<circle cx="660" cy="226" r="17" fill="#b8601d" stroke="#fff" stroke-width="3"/>
<text x="660" y="232" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<line x1="390" y1="446" x2="370" y2="446" stroke="#b8601d" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="370" cy="446" r="5" fill="#b8601d"/>
<circle cx="390" cy="446" r="17" fill="#b8601d" stroke="#fff" stroke-width="3"/>
<text x="390" y="452" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<line x1="830" y1="606" x2="810" y2="606" stroke="#b8601d" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="810" cy="606" r="5" fill="#b8601d"/>
<circle cx="830" cy="606" r="17" fill="#b8601d" stroke="#fff" stroke-width="3"/>
<text x="830" y="612" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<rect x="860" y="20" width="320" height="620" rx="14" fill="#0b1f3a"/>
<text x="884" y="56" font-size="18" font-weight="800" fill="#fff">Build a short main menu</text>
<circle cx="896" cy="87" r="13" fill="#b8601d"/><text x="896" y="92" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="920" y="92" font-size="14" fill="#e2e8f0">Open Online Store, then Navigation</text>
<text x="920" y="111" font-size="14" fill="#e2e8f0">(Menus) and choose Main menu.</text>
<circle cx="896" cy="143" r="13" fill="#b8601d"/><text x="896" y="148" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="920" y="148" font-size="14" fill="#e2e8f0">Keep 4 to 5 top links, such as</text>
<text x="920" y="167" font-size="14" fill="#e2e8f0">Shop, Bundles, Reviews, FAQ.</text>
<circle cx="896" cy="199" r="13" fill="#b8601d"/><text x="896" y="204" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="920" y="204" font-size="14" fill="#e2e8f0">Drag product types under Shop so</text>
<text x="920" y="223" font-size="14" fill="#e2e8f0">they become a drop-down.</text>
<circle cx="896" cy="255" r="13" fill="#b8601d"/><text x="896" y="260" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="920" y="260" font-size="14" fill="#e2e8f0">Add items that link to collections</text>
<text x="920" y="279" font-size="14" fill="#e2e8f0">or pages.</text>
<circle cx="896" cy="311" r="13" fill="#b8601d"/><text x="896" y="316" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="920" y="316" font-size="14" fill="#e2e8f0">Save, then check the menu on a</text>
<text x="920" y="335" font-size="14" fill="#e2e8f0">phone.</text>
<text x="24" y="668" font-size="12" fill="#64748b">Screens change often. Labels on your screen may look a little different.</text>
<text x="1176" y="668" font-size="12" fill="#64748b" text-anchor="end">Ecommerce Helix guide · not a real screenshot</text></svg>