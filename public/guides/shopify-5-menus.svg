<rect x="280" y="176" width="350" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="296" y="195" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">⋮⋮  Best sellers</text>
<rect x="280" y="212" width="350" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="296" y="231" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">⋮⋮  New</text>
<rect x="280" y="248" width="350" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="296" y="267" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">⋮⋮  Shirts</text>
<rect x="250" y="284" width="380" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="266" y="303" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">⋮⋮  Bundles</text>
<rect x="250" y="320" width="380" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="266" y="339" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">⋮⋮  Reviews</text>
<rect x="250" y="356" width="380" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="266" y="375" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">⋮⋮  FAQ</text>
<rect x="250" y="392" width="380" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="266" y="411" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">⋮⋮  About</text>
<rect x="250" y="432" width="120" height="28" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
<text x="310.0" y="451.0" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">+ Add menu item</text>
<rect x="230" y="470" width="580" height="140" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
<text x="250" y="500" font-size="14" font-weight="700" fill="#14532d" text-anchor="start">Rules of thumb</text>
<text x="250" y="528" font-size="13" font-weight="400" fill="#14532d" text-anchor="start">- 4 to 5 top links, the rest in drop-downs</text>
<text x="250" y="552" font-size="13" font-weight="400" fill="#14532d" text-anchor="start">- Make a separate, shorter menu for mobile</text>
<text x="250" y="576" font-size="13" font-weight="400" fill="#14532d" text-anchor="start">- Drag items to nest them under a parent</text>
<rect x="710" y="590" width="100" height="32" rx="6" fill="#008060" stroke="#008060" stroke-width="1"/>
<text x="760.0" y="611.0" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Save menu</text>
<line x1="210" y1="230" x2="196" y2="220" stroke="#b8601d" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="196" cy="220" r="5" fill="#b8601d"/>
<circle cx="210" cy="230" r="17" fill="#b8601d" stroke="#fff" stroke-width="3"/>
<text x="210" y="236" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<line x1="660" y1="154" x2="630" y2="154" stroke="#b8601d" stroke-width="2.5" stroke-dasharray="5 4"/>
