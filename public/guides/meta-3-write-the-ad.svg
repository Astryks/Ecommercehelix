<rect x="860" y="20" width="320" height="620" rx="14" fill="#0f172a"/>
<text x="884" y="56" font-size="18" font-weight="800" fill="#fff">Write the ad and add</text>
<text x="884" y="80" font-size="18" font-weight="800" fill="#fff">tracking</text>
<circle cx="896" cy="111" r="13" fill="#e11d48"/><text x="896" y="116" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="920" y="116" font-size="14" fill="#e2e8f0">Choose your Facebook Page and</text>
<text x="920" y="135" font-size="14" fill="#e2e8f0">Instagram account. The ad runs</text>
<text x="920" y="154" font-size="14" fill="#e2e8f0">from them.</text>
<circle cx="896" cy="186" r="13" fill="#e11d48"/><text x="896" y="191" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="920" y="191" font-size="14" fill="#e2e8f0">Add your video or photo. Tall</text>
<text x="920" y="210" font-size="14" fill="#e2e8f0">video works best.</text>
<circle cx="896" cy="242" r="13" fill="#e11d48"/><text x="896" y="247" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="920" y="247" font-size="14" fill="#e2e8f0">Write the main text and a short</text>
<text x="920" y="266" font-size="14" fill="#e2e8f0">headline. Start with your best</text>
<text x="920" y="285" font-size="14" fill="#e2e8f0">opening line.</text>
<circle cx="896" cy="317" r="13" fill="#e11d48"/><text x="896" y="322" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="920" y="322" font-size="14" fill="#e2e8f0">Add your store link and UTM tags,</text>
<text x="920" y="341" font-size="14" fill="#e2e8f0">so you can see sales from this ad.</text>
<circle cx="896" cy="373" r="13" fill="#e11d48"/><text x="896" y="378" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="920" y="378" font-size="14" fill="#e2e8f0">Check the preview. Press Publish</text>
<text x="920" y="397" font-size="14" fill="#e2e8f0">only when you are happy.</text>
<text x="24" y="668" font-size="12" fill="#64748b">Screens change often. Labels on your screen may look a little different.</text>
<text x="1176" y="668" font-size="12" fill="#64748b" text-anchor="end">Ecommerce Helix guide · not a real screenshot</text></svg>