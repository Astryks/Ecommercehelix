<circle cx="44" cy="40" r="6" fill="#fca5a5"/><circle cx="64" cy="40" r="6" fill="#fcd34d"/><circle cx="84" cy="40" r="6" fill="#86efac"/>
<text x="430" y="45" font-size="13" fill="#64748b" text-anchor="middle">Shopify admin (simplified drawing)</text>
<rect x="20" y="60" width="180" height="580" rx="0" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="100" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Settings</text>
<text x="40" y="140" font-size="14" font-weight="400" fill="#334155" text-anchor="start">  General</text>
<text x="40" y="180" font-size="14" font-weight="400" fill="#334155" text-anchor="start">  Payments</text>
<text x="40" y="220" font-size="14" font-weight="700" fill="#008060" text-anchor="start">  Shipping and delivery</text>
<text x="40" y="260" font-size="14" font-weight="400" fill="#334155" text-anchor="start">  Taxes</text>
<text x="230" y="100" font-size="18" font-weight="800" fill="#0f172a" text-anchor="start">Shipping and delivery</text>
