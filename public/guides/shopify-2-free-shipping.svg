<rect x="20" y="60" width="820" height="580" fill="#0f172a" opacity="0.3"/>
<rect x="300" y="250" width="460" height="330" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
<text x="324" y="284" font-size="17" font-weight="800" fill="#0f172a" text-anchor="start">Add rate</text>
<text x="324" y="306" font-size="12" font-weight="600" fill="#475569" text-anchor="start">Rate name</text>
<rect x="324" y="314" width="410" height="34" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
<text x="334" y="336.0" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">Free shipping</text>
<text x="324" y="366" font-size="12" font-weight="600" fill="#475569" text-anchor="start">Price</text>
<rect x="324" y="374" width="410" height="34" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
<text x="334" y="396.0" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">$0.00</text>
<rect x="324" y="430" width="18" height="18" rx="4" fill="#008060" stroke="#008060" stroke-width="1"/>
<text x="352" y="444" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">Offer free shipping over a minimum amount</text>
<text x="324" y="462" font-size="12" font-weight="600" fill="#475569" text-anchor="start">Minimum order amount</text>
<rect x="324" y="470" width="410" height="34" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
<text x="334" y="492.0" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">$120.00</text>
<rect x="654" y="530" width="80" height="32" rx="6" fill="#008060" stroke="#008060" stroke-width="1"/>
<text x="694.0" y="551.0" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Done</text>
