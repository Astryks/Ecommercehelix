<text x="250" y="150" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">General shipping rates</text>
<text x="250" y="176" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Domestic · Standard $9.95</text>
<rect x="690" y="190" width="100" height="32" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
