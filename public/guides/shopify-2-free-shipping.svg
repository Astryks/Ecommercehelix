<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Set a free shipping amount" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Set a free shipping amount</title>
