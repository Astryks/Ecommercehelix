<circle cx="290" cy="440" r="17" fill="#b8601d" stroke="#fff" stroke-width="3"/>
<text x="290" y="446" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<line x1="290" y1="492" x2="324" y2="492" stroke="#b8601d" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="324" cy="492" r="5" fill="#b8601d"/>
<circle cx="290" cy="492" r="17" fill="#b8601d" stroke="#fff" stroke-width="3"/>
<text x="290" y="498" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<line x1="754" y1="546" x2="734" y2="546" stroke="#b8601d" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="734" cy="546" r="5" fill="#b8601d"/>
<circle cx="754" cy="546" r="17" fill="#b8601d" stroke="#fff" stroke-width="3"/>
<text x="754" y="552" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<rect x="860" y="20" width="320" height="620" rx="14" fill="#0b1f3a"/>
<text x="884" y="56" font-size="18" font-weight="800" fill="#fff">Set a free shipping amount</text>
<circle cx="896" cy="87" r="13" fill="#b8601d"/><text x="896" y="92" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="920" y="92" font-size="14" fill="#e2e8f0">Open Settings, then Shipping and</text>
<text x="920" y="111" font-size="14" fill="#e2e8f0">delivery.</text>
<circle cx="896" cy="143" r="13" fill="#b8601d"/><text x="896" y="148" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="920" y="148" font-size="14" fill="#e2e8f0">In your shipping rates, press Add</text>
<text x="920" y="167" font-size="14" fill="#e2e8f0">rate.</text>
<circle cx="896" cy="199" r="13" fill="#b8601d"/><text x="896" y="204" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="920" y="204" font-size="14" fill="#e2e8f0">Name it Free shipping and turn on</text>
<text x="920" y="223" font-size="14" fill="#e2e8f0">&#x27;offer free shipping over a</text>
<text x="920" y="242" font-size="14" fill="#e2e8f0">minimum amount&#x27;.</text>
<circle cx="896" cy="274" r="13" fill="#b8601d"/><text x="896" y="279" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="920" y="279" font-size="14" fill="#e2e8f0">Type your amount: about 1.3 times</text>
<text x="920" y="298" font-size="14" fill="#e2e8f0">your AOV.</text>
<circle cx="896" cy="330" r="13" fill="#b8601d"/><text x="896" y="335" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="920" y="335" font-size="14" fill="#e2e8f0">Press Done, then Save.</text>
<text x="24" y="668" font-size="12" fill="#64748b">Screens change often. Labels on your screen may look a little different.</text>
<text x="1176" y="668" font-size="12" fill="#64748b" text-anchor="end">Ecommerce Helix guide · not a real screenshot</text></svg>