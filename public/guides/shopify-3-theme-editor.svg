<rect x="600" y="246" width="190" height="92" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
<text x="616" y="270" font-size="13" font-weight="400" fill="#334155" text-anchor="start">Preview</text>
<text x="616" y="296" font-size="13" font-weight="700" fill="#008060" text-anchor="start">Duplicate</text>
<text x="616" y="322" font-size="13" font-weight="400" fill="#334155" text-anchor="start">Edit code</text>
<rect x="230" y="360" width="580" height="120" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
<text x="250" y="390" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Theme library</text>
<rect x="250" y="404" width="120" height="60" rx="6" fill="#e2e8f0" stroke="none" stroke-width="1"/>
<text x="386" y="428" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Copy of Dawn (edit this one)</text>
<rect x="386" y="440" width="90" height="28" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
<text x="431.0" y="459.0" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Customize</text>
<rect x="486" y="440" width="80" height="28" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
<text x="526.0" y="459.0" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Publish</text>
<rect x="230" y="500" width="580" height="110" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
<text x="250" y="530" font-size="14" font-weight="700" fill="#14532d" text-anchor="start">In Customize &gt; Theme settings set:</text>
<text x="250" y="556" font-size="13" font-weight="400" fill="#14532d" text-anchor="start">Logo · 2 to 3 colours · 1 to 2 fonts · button style</text>
<text x="250" y="580" font-size="13" font-weight="400" fill="#14532d" text-anchor="start">Then edit sections: header, banner, featured products</text>
<line x1="210" y1="230" x2="196" y2="220" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="196" cy="220" r="5" fill="#e11d48"/>
<circle cx="210" cy="230" r="17" fill="#e11d48" stroke="#fff" stroke-width="3"/>
<text x="210" y="236" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<line x1="580" y1="330" x2="640" y2="296" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="640" cy="296" r="5" fill="#e11d48"/>
<circle cx="580" cy="330" r="17" fill="#e11d48" stroke="#fff" stroke-width="3"/>
<text x="580" y="336" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<line x1="400" y1="490" x2="430" y2="456" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="430" cy="456" r="5" fill="#e11d48"/>
<circle cx="400" cy="490" r="17" fill="#e11d48" stroke="#fff" stroke-width="3"/>
<text x="400" y="496" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<line x1="210" y1="555" x2="230" y2="555" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="230" cy="555" r="5" fill="#e11d48"/>
<circle cx="210" cy="555" r="17" fill="#e11d48" stroke="#fff" stroke-width="3"/>
<text x="210" y="561" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<line x1="590" y1="490" x2="526" y2="456" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="526" cy="456" r="5" fill="#e11d48"/>
<circle cx="590" cy="490" r="17" fill="#e11d48" stroke="#fff" stroke-width="3"/>
<text x="590" y="496" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<rect x="860" y="20" width="320" height="620" rx="14" fill="#0f172a"/>
<text x="884" y="56" font-size="18" font-weight="800" fill="#fff">Set up your theme safely</text>
<circle cx="896" cy="87" r="13" fill="#e11d48"/><text x="896" y="92" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="920" y="92" font-size="14" fill="#e2e8f0">Open Online Store, then Themes.</text>
<circle cx="896" cy="124" r="13" fill="#e11d48"/><text x="896" y="129" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="920" y="129" font-size="14" fill="#e2e8f0">Press the ... button on your theme</text>
<text x="920" y="148" font-size="14" fill="#e2e8f0">and choose Duplicate.</text>
<circle cx="896" cy="180" r="13" fill="#e11d48"/><text x="896" y="185" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="920" y="185" font-size="14" fill="#e2e8f0">On the copy, press Customize to</text>
<text x="920" y="204" font-size="14" fill="#e2e8f0">make your changes.</text>
<circle cx="896" cy="236" r="13" fill="#e11d48"/><text x="896" y="241" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="920" y="241" font-size="14" fill="#e2e8f0">Set logo, colours, fonts and</text>
<text x="920" y="260" font-size="14" fill="#e2e8f0">buttons once in Theme settings.</text>
<circle cx="896" cy="292" r="13" fill="#e11d48"/><text x="896" y="297" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="920" y="297" font-size="14" fill="#e2e8f0">Preview on a phone, then Publish</text>
<text x="920" y="316" font-size="14" fill="#e2e8f0">the copy.</text>
<text x="24" y="668" font-size="12" fill="#64748b">Screens change often. Labels on your screen may look a little different.</text>
<text x="1176" y="668" font-size="12" fill="#64748b" text-anchor="end">Ecommerce Helix guide · not a real screenshot</text></svg>