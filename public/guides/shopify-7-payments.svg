<line x1="640" y1="210" x2="600" y2="216" stroke="#b8601d" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="600" cy="216" r="5" fill="#b8601d"/>
<circle cx="640" cy="210" r="17" fill="#b8601d" stroke="#fff" stroke-width="3"/>
<text x="640" y="216" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<line x1="830" y1="326" x2="790" y2="326" stroke="#b8601d" stroke-width="2.5" stroke-dasharray="5 4"/>
