<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Turn on payments" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Turn on payments</title>
<rect width="1200" height="700" rx="18" fill="#faf7f2"/>
<rect x="20" y="20" width="820" height="620" rx="14" fill="#fff" stroke="#cbd5e1"/>
<rect x="20" y="20" width="820" height="40" rx="14" fill="#f1f5f9"/><rect x="20" y="46" width="820" height="14" fill="#f1f5f9"/>
<circle cx="44" cy="40" r="6" fill="#fca5a5"/><circle cx="64" cy="40" r="6" fill="#fcd34d"/><circle cx="84" cy="40" r="6" fill="#86efac"/>
<text x="430" y="45" font-size="13" fill="#64748b" text-anchor="middle">Shopify admin (simplified drawing)</text>
<rect x="20" y="60" width="180" height="580" rx="0" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="100" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Settings</text>
<text x="40" y="140" font-size="14" font-weight="400" fill="#334155" text-anchor="start">  General</text>
<text x="40" y="180" font-size="14" font-weight="700" fill="#008060" text-anchor="start">  Payments</text>
<text x="40" y="220" font-size="14" font-weight="400" fill="#334155" text-anchor="start">  Checkout</text>
<text x="40" y="260" font-size="14" font-weight="400" fill="#334155" text-anchor="start">  Taxes and duties</text>
<text x="230" y="100" font-size="18" font-weight="800" fill="#0f172a" text-anchor="start">Payments</text>
<rect x="230" y="120" width="580" height="150" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
<text x="250" y="150" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Shopify Payments</text>
<text x="250" y="174" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Cards · Shop Pay · Apple Pay · Google Pay</text>
<rect x="250" y="196" width="110" height="32" rx="6" fill="#008060" stroke="#008060" stroke-width="1"/>
<text x="305.0" y="217.0" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Activate</text>
<text x="380" y="216" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Statement name: YOURBRAND</text>
<rect x="230" y="290" width="580" height="70" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
<text x="250" y="330" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">PayPal</text>
<rect x="690" y="310" width="100" height="32" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
<text x="740.0" y="331.0" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Activate</text>
<rect x="230" y="380" width="580" height="110" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
<text x="250" y="410" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Buy now, pay later</text>
<text x="250" y="436" font-size="13" font-weight="400" fill="#475569" text-anchor="start">AU: Afterpay app  ·  US: Shop Pay Installments</text>
<text x="250" y="460" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Check the fee first. It is higher than a card fee.</text>
<rect x="750" y="400" width="36" height="20" rx="10" fill="#008060" stroke="none" stroke-width="1"/>
<circle cx="776" cy="410" r="7" fill="#fff"/>
<rect x="230" y="510" width="580" height="100" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
<text x="250" y="540" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Payouts</text>
<text x="250" y="566" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Bank account ending 1234 · paid every business day</text>
