<circle cx="830" cy="326" r="17" fill="#b8601d" stroke="#fff" stroke-width="3"/>
<text x="830" y="332" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<line x1="830" y1="410" x2="786" y2="410" stroke="#b8601d" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="786" cy="410" r="5" fill="#b8601d"/>
<circle cx="830" cy="410" r="17" fill="#b8601d" stroke="#fff" stroke-width="3"/>
<text x="830" y="416" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<line x1="830" y1="560" x2="810" y2="560" stroke="#b8601d" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="810" cy="560" r="5" fill="#b8601d"/>
<circle cx="830" cy="560" r="17" fill="#b8601d" stroke="#fff" stroke-width="3"/>
<text x="830" y="566" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<rect x="860" y="20" width="320" height="620" rx="14" fill="#0b1f3a"/>
<text x="884" y="56" font-size="18" font-weight="800" fill="#fff">Turn on payments</text>
<circle cx="896" cy="87" r="13" fill="#b8601d"/><text x="896" y="92" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="920" y="92" font-size="14" fill="#e2e8f0">Open Settings, then Payments.</text>
<circle cx="896" cy="124" r="13" fill="#b8601d"/><text x="896" y="129" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="920" y="129" font-size="14" fill="#e2e8f0">Activate Shopify Payments for</text>
<text x="920" y="148" font-size="14" fill="#e2e8f0">cards and express buttons.</text>
<circle cx="896" cy="180" r="13" fill="#b8601d"/><text x="896" y="185" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="920" y="185" font-size="14" fill="#e2e8f0">Set the statement name to your</text>
<text x="920" y="204" font-size="14" fill="#e2e8f0">brand.</text>
<circle cx="896" cy="236" r="13" fill="#b8601d"/><text x="896" y="241" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="920" y="241" font-size="14" fill="#e2e8f0">Activate PayPal.</text>
<circle cx="896" cy="273" r="13" fill="#b8601d"/><text x="896" y="278" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="920" y="278" font-size="14" fill="#e2e8f0">Add one buy now, pay later option</text>
<text x="920" y="297" font-size="14" fill="#e2e8f0">if the fee suits you.</text>
<circle cx="896" cy="329" r="13" fill="#b8601d"/><text x="896" y="334" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="920" y="334" font-size="14" fill="#e2e8f0">Add your bank account for payouts.</text>
<text x="24" y="668" font-size="12" fill="#64748b">Screens change often. Labels on your screen may look a little different.</text>
<text x="1176" y="668" font-size="12" fill="#64748b" text-anchor="end">Ecommerce Helix guide · not a real screenshot</text></svg>