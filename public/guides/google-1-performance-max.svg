<rect x="860" y="20" width="320" height="620" rx="14" fill="#0f172a"/>
<text x="884" y="56" font-size="18" font-weight="800" fill="#fff">Start a shopping campaign</text>
<circle cx="896" cy="87" r="13" fill="#e11d48"/><text x="896" y="92" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="920" y="92" font-size="14" fill="#e2e8f0">In Google Ads, press the + button</text>
<text x="920" y="111" font-size="14" fill="#e2e8f0">to start a new campaign.</text>
<circle cx="896" cy="143" r="13" fill="#e11d48"/><text x="896" y="148" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="920" y="148" font-size="14" fill="#e2e8f0">Pick Sales as the goal.</text>
<circle cx="896" cy="180" r="13" fill="#e11d48"/><text x="896" y="185" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="920" y="185" font-size="14" fill="#e2e8f0">Pick Performance Max. It shows</text>
<text x="920" y="204" font-size="14" fill="#e2e8f0">your products across Google.</text>
<circle cx="896" cy="236" r="13" fill="#e11d48"/><text x="896" y="241" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="920" y="241" font-size="14" fill="#e2e8f0">Link your product list from</text>
<text x="920" y="260" font-size="14" fill="#e2e8f0">Merchant Center.</text>
<circle cx="896" cy="292" r="13" fill="#e11d48"/><text x="896" y="297" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="920" y="297" font-size="14" fill="#e2e8f0">Exclude your brand name, so this</text>
<text x="920" y="316" font-size="14" fill="#e2e8f0">campaign finds new customers.</text>
<text x="24" y="668" font-size="12" fill="#64748b">Screens change often. Labels on your screen may look a little different.</text>
<text x="1176" y="668" font-size="12" fill="#64748b" text-anchor="end">Ecommerce Helix guide · not a real screenshot</text></svg>